<div class="whats-new">
  <ui5-title level="H5" class="whats-new__title">What's New</ui5-title>
  <ui5-list separators="Inner" class="whats-new__list">
    @for (item of headlines; track item.title) {
      <ui5-li icon="{{ item.icon }}" description="{{ item.description }}">
        {{ item.title }}
      </ui5-li>
    }
  </ui5-list>
</div>

<div class="card">
  @if (editMode()) {
    <ui5-button
      class="card__remove"
      design="Default"
      icon="decline"
      (click)="removeCard.emit()">
    </ui5-button>
  }
  @if (card().title) {
    <div class="card__header">{{ card().title }}</div>
  }
  <div class="card__body">
    <ng-content />
  </div>
</div>

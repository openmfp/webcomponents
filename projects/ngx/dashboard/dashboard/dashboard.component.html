<div class="dashboard">
  <div class="dashboard__topbar">
    <div class="dashboard__header">
      @if (config().title) {
        <ui5-title level="H2" size="H2" wrapping-type="Normal">{{
          config().title
        }}</ui5-title>
      }
      @if (config().description) {
        <ui5-text>{{ config().description }}</ui5-text>
      }
    </div>

    <div class="dashboard__toolbar">
      <ui5-button id="add-card-btn" design="Default" (click)="openCardPanel()">+ Add Card</ui5-button>
      <ui5-button id="add-section-btn" design="Emphasized" (click)="openPanel()">+ Add Section</ui5-button>
    </div>
  </div>

  @for (section of sections(); track section.id) {
    <mfp-dashboard-section
      [section]="section"
      [columns]="12"
      (removeSection)="removeSection(section.id)"
      (removeCard)="removeSectionCard(section.id, $event)"
    />
  }

  @for (card of cards(); track card.id) {
    <mfp-dashboard-card [card]="card" (removeCard)="removeCard(card.id)" />
  }
</div>

<ui5-popover
  opener="add-section-btn"
  [open]="sectionPanelOpen()"
  placement="Bottom"
  horizontal-align="End"
  header-text="Add Section"
  (ui5BeforeClose)="closePanel()"
>
  <div class="add-panel">
    <div class="add-panel__row">
      <ui5-label for="add-title" show-colon>Title</ui5-label>
      <ui5-input
        id="add-title"
        placeholder="Optional"
        [value]="formTitle"
        (input)="formTitle = $any($event.target).value"
      ></ui5-input>
    </div>
    <div class="add-panel__row">
      <ui5-label for="add-cols" show-colon>Columns</ui5-label>
      <ui5-input
        id="add-cols"
        type="Number"
        [value]="formCols"
        (input)="formCols = +$any($event.target).value"
        class="add-panel__input--number"
      ></ui5-input>
    </div>
    <div class="add-panel__row">
      <ui5-label for="add-rows" show-colon>Rows</ui5-label>
      <ui5-input
        id="add-rows"
        type="Number"
        [value]="formRows"
        (input)="formRows = +$any($event.target).value"
        class="add-panel__input--number"
      ></ui5-input>
    </div>
    <div class="add-panel__actions">
      <ui5-button design="Transparent" (click)="closePanel()">Cancel</ui5-button>
      <ui5-button design="Emphasized" (click)="confirmAdd()">Add</ui5-button>
    </div>
  </div>
</ui5-popover>

<ui5-popover
  opener="add-card-btn"
  [open]="cardPanelOpen()"
  placement="Bottom"
  horizontal-align="End"
  header-text="Add Card"
  (ui5BeforeClose)="closeCardPanel()"
>
  <div class="add-panel">
    <div class="add-panel__row">
      <ui5-label for="card-title" show-colon>Title</ui5-label>
      <ui5-input
        id="card-title"
        placeholder="Optional"
        [value]="cardFormTitle"
        (input)="cardFormTitle = $any($event.target).value"
      ></ui5-input>
    </div>
    <div class="add-panel__row">
      <ui5-label for="card-cols" show-colon>Columns</ui5-label>
      <ui5-input
        id="card-cols"
        type="Number"
        [value]="cardFormCols"
        (input)="cardFormCols = +$any($event.target).value"
        class="add-panel__input--number"
      ></ui5-input>
    </div>
    <div class="add-panel__row">
      <ui5-label for="card-rows" show-colon>Rows</ui5-label>
      <ui5-input
        id="card-rows"
        type="Number"
        [value]="cardFormRows"
        (input)="cardFormRows = +$any($event.target).value"
        class="add-panel__input--number"
      ></ui5-input>
    </div>
    <div class="add-panel__actions">
      <ui5-button design="Transparent" (click)="closeCardPanel()">Cancel</ui5-button>
      <ui5-button design="Emphasized" (click)="confirmAddCard()">Add</ui5-button>
    </div>
  </div>
</ui5-popover>

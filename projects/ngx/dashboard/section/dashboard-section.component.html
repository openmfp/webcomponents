<div class="section">
  @if (editMode()) {
    <ui5-button
      class="section__remove"
      design="Default"
      icon="decline"
      (click)="removeSection.emit()"
    >
    </ui5-button>
  }
  @if (section().title) {
    <div class="section__header">
      <span class="section__title">{{ section().title }}</span>
    </div>
  }
  <div class="section__grid" [style.--cols]="columns()">
    @for (card of section().cards; track card.id) {
      <mfp-dashboard-card [card]="card" [editMode]="editMode()" (removeCard)="removeCard.emit(card.id)" />
    }
  </div>
</div>

@if (state() === 'ready') {
  <mfp-data-fetch-metadata
    [lastUpdated]="lastUpdated()"
    [snapshot]="snapshot()"
    [status]="status()"
  />

  <mfp-declarative-table
    appearance="card"
    [columns]="columns()"
    [resources]="rows()"
    [trackByPath]="trackByPath() ?? 'id'"
  />
} @else {
  <mfp-data-fetch-state
    kind="table"
    [emptyState]="emptyState()"
    [errorState]="errorState()"
  />
}

@if (card().component) {
  <div class="component-card" [class.component-card--editing]="editMode()">
    @if (editMode()) {
      <div class="remove-wrapper">
        <ui5-button
          class="card__remove"
          design="Default"
          icon="decline"
          [accessibleName]="
            removeCardLabel() +
            ': ' +
            (card().label || card().component)
          "
          (click)="removeCard.emit()"
        />
      </div>
      <ui5-icon
        aria-hidden="true"
        class="card__resize-indicator"
        name="resize-corner"
        [accessibleName]="resizableLabel()"
      />
    }
    <div
      class="component-host"
      [style.pointer-events]="editMode() ? 'none' : 'auto'"
    >
      <div #elementHost></div>
    </div>
  </div>
} @else {
  <div class="card">
    <div
      class="card__body"
      [style.pointer-events]="editMode() ? 'none' : 'auto'"
    >
      <ng-content />
    </div>
  </div>
}

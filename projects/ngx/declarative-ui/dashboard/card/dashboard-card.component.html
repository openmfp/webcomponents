@if (card().component) {
  <div class="component-card">
    @if (editMode()) {
      <div class="remove-wrapper">
        <ui5-button
          class="card__remove"
          design="Default"
          icon="decline"
          (click)="removeCard.emit()"
        />
      </div>
    }
    <div
      [style.pointer-events]="editMode() ? 'none' : 'auto'"
      class="component-host"
    >
      <div #elementHost></div>
    </div>
  </div>
} @else {
  <div class="card">
    <div
      [style.pointer-events]="editMode() ? 'none' : 'auto'"
      class="card__body"
    >
      <ng-content />
    </div>
  </div>
}

@if (card().component) {
  <div class="component-card" [attr.data-testid]="'dashboard-card-' + card().id" [class.component-card--editing]="editMode()">
    @if (editMode()) {
      <div class="remove-wrapper">
        <ui5-button
          class="card__remove"
          design="Default"
          icon="decline"
          [attr.data-testid]="'dashboard-card-' + card().id + '-remove'"
          [accessibleName]="
            i18n.getTranslation(i18nKeys.REMOVE_CARD) +
            ': ' +
            (card().label || card().component)
          "
          (click)="removeCard.emit()"
        />
      </div>
      <ui5-icon
        aria-hidden="true"
        class="card__resize-indicator"
        name="resize-corner"
        [accessibleName]="i18n.getTranslation(i18nKeys.RESIZABLE)"
      />
    }
    <div
      [class]="componentHostClasses"
      [style.pointer-events]="editMode() ? 'none' : 'auto'"
    >
      <div #elementHost></div>
    </div>
  </div>
} @else {
  <div class="card" [attr.data-testid]="'dashboard-card-' + card().id">
    <div
      [class]="cardBodyClasses"
      [style.pointer-events]="editMode() ? 'none' : 'auto'"
    >
      <ng-content />
    </div>
  </div>
}

<ui5-dialog state="Critical" [open]="open()" (ui5BeforeClose)="cancelled.emit()">
  <div class="unsaved-changes-dialog__header" slot="header">
    <ui5-title level="H5">{{ headerText() }}</ui5-title>
  </div>
  <div class="unsaved-changes-dialog__body">
    {{ bodyText() }}
  </div>
  <div class="unsaved-changes-dialog__footer" slot="footer">
    <ui5-button design="Emphasized" (click)="save.emit()">{{ saveLabel() }}</ui5-button>
    <ui5-button design="Transparent" (click)="discard.emit()">{{ discardLabel() }}</ui5-button>
    <ui5-button design="Transparent" (click)="cancelled.emit()">{{ cancelLabel() }}</ui5-button>
  </div>
</ui5-dialog>

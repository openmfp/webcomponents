<ui5-dialog
  data-testid="dashboard-discard-changes-dialog"
  state="Critical"
  [open]="open()"
  (ui5BeforeClose)="cancelled.emit()"
>
  <div class="discard-changes-dialog__header" slot="header">
    <ui5-title level="H5">{{
      i18n.getTranslation(i18nKeys.DISCARD_CHANGES)
    }}</ui5-title>
  </div>
  <div class="discard-changes-dialog__body">
    {{ i18n.getTranslation(i18nKeys.DISCARD_CONFIRM_BODY) }}
  </div>
  <div class="discard-changes-dialog__footer" slot="footer">
    <ui5-button
      data-testid="dashboard-discard-changes-confirm-btn"
      design="Emphasized"
      (click)="confirm.emit()"
      >{{ i18n.getTranslation(i18nKeys.DISCARD) }}</ui5-button
    >
    <ui5-button
      data-testid="dashboard-discard-changes-cancel-btn"
      design="Transparent"
      (click)="cancelled.emit()"
      >{{ i18n.getTranslation(i18nKeys.CANCEL) }}</ui5-button
    >
  </div>
</ui5-dialog>

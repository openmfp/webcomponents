<div
  class="section"
  [attr.data-testid]="'dashboard-section-' + section().id"
  [class.section--edit]="editMode() && section().editable !== false"
>
  @if (editMode() && section().editable !== false) {
    <ui5-button
      class="section__remove"
      design="Default"
      icon="decline"
      [accessibleName]="
        i18n.getTranslation(i18nKeys.REMOVE_SECTION) +
        ': ' +
        (section().title || section().id)
      "
      [attr.data-testid]="'dashboard-section-' + section().id + '-remove'"
      (click)="removeSection.emit()"
    />
  }
  @if (section().title) {
    <div class="section__header">
      <span
        class="section__title"
        [attr.data-testid]="'dashboard-section-' + section().id + '-title'"
        >{{ section().title }}</span
      >
    </div>
  }
  <div class="section__grid" [style.--cols]="columns() ?? null">
    @for (card of cards(); track card.id) {
      <mfp-dashboard-card
        [card]="card"
        [editMode]="editMode() && section().editable !== false"
        (removeCard)="removeCard.emit($any(card.id))"
      />
    }
  </div>
</div>

<div class="card" data-testid="generic-table-card">
  <div class="card__header">
    <div class="card__title">
      @if (header(); as header) {
        {{ header }}
        @if (headerTooltip(); as tooltip) {
          <ui5-icon
            class="card__info-icon"
            name="hint"
            [accessibleName]="tooltip"
            [showTooltip]="true"
          />
        }
      }
    </div>
    <div class="card__actions">
      @if (resourcesSearchable()) {
        <ui5-input
          class="card__search-input"
          data-testid="generic-table-card-search-input"
          [formControl]="searchControl"
          [placeholder]="searchPlaceholder()"
          [showClearIcon]="true"
        >
          <ui5-icon
            class="card__search-icon"
            data-testid="generic-table-card-search-icon"
            name="search"
            slot="icon"
            [accessibleName]="searchButtonConfig()?.tooltip ?? 'Search'"
            [showTooltip]="true"
            (click)="submitSearch()"
          />
        </ui5-input>
      }
      @if (createFormConfig()) {
        <ui5-button
          class="card__create-btn"
          data-testid="generic-table-card-create-btn"
          [accessibleName]="
            createButtonConfig()?.text ||
            createButtonConfig()?.tooltip ||
            'Create'
          "
          [design]="createButtonConfig()?.design ?? 'Transparent'"
          [icon]="createButtonConfig()?.icon ?? 'add'"
          [tooltip]="createButtonConfig()?.tooltip"
          (click)="openCreateDialog()"
        >
          {{ createButtonConfig()?.text ?? '' }}
        </ui5-button>
      }
    </div>
  </div>

  @if (hasFilterTabs()) {
    <mfp-filter-tabs
      [tabs]="filterTabs()"
      (tabChanged)="onFilterTabChanged($event)"
    />
  }

  <div class="card__body">
    @if (tableConfig(); as config) {
      <mfp-declarative-table
        [columns]="effectiveColumns()"
        [currentPage]="config.currentPage ?? 1"
        [error]="error()"
        [hasMore]="config.hasMore ?? false"
        [height]="config.height"
        [loadMode]="config.loadMode ?? 'button'"
        [loadMoreButtonText]="config.loadMoreButtonText ?? 'Load More'"
        [loading]="loading()"
        [loadingDelay]="loadingDelay()"
        [paginationLimit]="config.paginationLimit ?? 5"
        [permissions]="permissions()"
        [resources]="resources()"
        [totalItemsCount]="config.totalItemsCount"
        (buttonClick)="onButtonClick($event)"
        (loadMoreResources)="loadMoreResources.emit()"
        (pageChange)="pageChange.emit($event)"
        (paginationLimitChanged)="paginationLimitChanged.emit($event)"
        (retry)="retry.emit()"
        (tableRowClicked)="tableRowClicked.emit($event)"
      />
    }
  </div>
</div>

@if (createDialogOpen()) {
  <mfp-resource-form-dialog
    dataTestidPrefix="generic-table-card-create"
    defaultConfirmLabel="Save"
    defaultTitle="Create"
    [config]="createFormConfig()"
    [fieldErrors]="createFormState().fieldErrors ?? {}"
    [fields]="resolvedCreateFields()"
    [initialValues]="{}"
    [open]="createDialogOpen()"
    (cancelled)="closeCreateDialog()"
    (fieldChange)="onCreateFieldChange($event)"
    (submitted)="onCreateSubmit($event)"
  />
}

@if (editDialogOpen()) {
  <mfp-resource-form-dialog
    dataTestidPrefix="generic-table-card-edit"
    defaultConfirmLabel="Edit"
    defaultTitle="Edit"
    [config]="editFormConfig()"
    [fieldErrors]="editFormState().fieldErrors ?? {}"
    [fields]="resolvedEditFields()"
    [initialValues]="editInitialValue()"
    [open]="editDialogOpen()"
    (cancelled)="closeEditDialog()"
    (fieldChange)="onEditFieldChange($event)"
    (submitted)="onEditSubmit($event)"
  />
}

<mfp-delete-confirmation-dialog
  [config]="deleteConfirmationConfig()"
  [open]="deleteDialogOpen()"
  (cancelled)="closeDeleteDialog()"
  (confirmed)="onDeleteSubmit()"
/>

name: pipe

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      # TODO(follow-up): re-enable once the ~74 pre-existing Prettier violations are fixed
      # repo-wide (`npm run format`). The previous pipeline never format-checked, so enabling
      # this now would fail CI on unrelated files. Track as an immediate follow-up.
      # - run: npm run check-format
      - run: npm test
      - run: npm run build

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard E2E Harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #dash {
        display: block;
        height: 100%;
      }

      .e2e-card {
        box-sizing: border-box;
        height: 100%;
        border: 2px solid #607d8b;
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }

      .e2e-card__header {
        padding: 8px 12px;
        border-bottom: 1px solid #607d8b;
        background: #e8eef2;
        color: #263238;
        font: 600 14px/20px sans-serif;
      }
    </style>
  </head>
  <body>
    <mfp-wc-dashboard id="dash"></mfp-wc-dashboard>

    <!--
      CRITICAL ORDERING: properties are set on the element BEFORE the bundle is
      imported. The z-flow grid engine (ZflowGridStackEngine) is chosen once, at
      grid init, from config.zFlow — gridstack reads `engineClass` only in its
      engine constructor and never swaps it later. Angular Elements seeds signal
      inputs from DOM properties already present at upgrade, so config must be on
      the element before customElements.define() upgrades it. A classic (non-
      module) inline script runs synchronously here, before the deferred module
      import below — guaranteeing the property is in place at upgrade. Setting
      config after boot (post-whenDefined) inits the grid on the BASE engine, so
      keyboard nav and stepped resize silently no-op.
    -->
    <script>
      (function () {
        // Deterministic z-flow dataset. All loose cards (no sectionId) so the
        // z-flow engine owns layout and each card is a real .grid-stack-item
        // with gs-id / gs-x / gs-y and --gs-w / --gs-h. Plain 'wc' div
        // placeholders keep the harness free of the Angular component registry
        // and external data. Their visible headers identify cards during UI runs.
        //
        // At 1280px viewport the z-flow grid uses 12 columns (page size 'l').
        // Card spans per size: s=4, m=8, l=10, xl=12, xxl=12.
        //
        //   e2e-a  size=s  -> span=4  (full ladder [4,8,10,12]; effectiveMax=12)
        //   e2e-b  size=m  -> span=8  (packed at x=4; effectiveMax=12-4=8; ladder [4,8])
        //   e2e-c  size=m  -> span=8  (shrink/grow tests)
        //   e2e-d  size=s  -> span=4  (move / reorder target)
        //   e2e-e  size=s  -> span=4  (move / reorder target)
        //   e2e-g  size=s  -> span=4  (plain card, ensures ≥2 rows)
        //   e2e-h  size=s  -> span=4  (plain card, ensures ≥3 rows)
        //   e2e-f  size=s             -> availableCards ONLY -> add flow
        //   e2e-i  size=s             -> availableCards ONLY -> multi-add flow
        //
        // zFlowOrder is set explicitly so z-flow uses this order directly
        // (hasZFlowOrder() skips position-based re-seeding). Layout at 12 cols:
        //   Row 0 (gs-y=0): a(x=0,w=4), b(x=4,w=8)
        //   Row 1 (gs-y=1): c(x=0,w=8), d(x=8,w=4)
        //   Row 2 (gs-y=2): e(x=0,w=4), g(x=4,w=4), h(x=8,w=4)
        const H = 40; // z-flow cardHeight (px rows); loose height pinned to this.

        const cardContent = (id, number) => ({
          className: 'e2e-card',
          innerHTML: `<header class="e2e-card__header">Card ${number} · ${id}</header>`,
        });

        const card = (id, size, zFlowOrder) => ({
          id,
          type: 'wc',
          component: 'div',
          componentInputs: cardContent(id, zFlowOrder + 1),
          size,
          zFlowOrder,
          h: H,
          x: 0,
          y: 0,
          label: id,
        });

        const SIZES_DATASET =
          new URLSearchParams(location.search).get('dataset') === 'sizes';

        const CARDS = SIZES_DATASET
          ? ['s', 'm', 'l', 'xl', 'xxl'].map((size, zFlowOrder) =>
              card(`size-${size}`, size, zFlowOrder),
            )
          : [
              card('e2e-a', 's', 0), // w=4 at 12 cols
              card('e2e-b', 'm', 1), // w=8 at 12 cols
              card('e2e-c', 'm', 2), // w=8 at 12 cols
              card('e2e-d', 's', 3), // w=4 at 12 cols
              card('e2e-e', 's', 4), // w=4 at 12 cols
              card('e2e-g', 's', 5), // w=4 at 12 cols
              card('e2e-h', 's', 6), // w=4 at 12 cols
            ];

        // AVAILABLE_CARDS copies strip zFlowOrder: available-only cards have no
        // predetermined order — zFlowOrder is assigned when they are added to front.
        const AVAILABLE_CARDS = CARDS.map(({ zFlowOrder: _, ...rest }) => ({
          ...rest,
        }));
        AVAILABLE_CARDS.push({
          id: 'e2e-f',
          type: 'wc',
          component: 'div',
          componentInputs: cardContent('e2e-f', 8),
          size: 's',
          h: H,
          x: 0,
          y: 0,
          label: 'e2e-f',
        });
        AVAILABLE_CARDS.push({
          id: 'e2e-i',
          type: 'wc',
          component: 'div',
          componentInputs: cardContent('e2e-i', 9),
          size: 's',
          h: H,
          x: 0,
          y: 0,
          label: 'e2e-i',
        });

        const el = document.getElementById('dash');

        // Seed inputs as DOM properties on the un-upgraded element.
        el.config = { editable: true, zFlow: { cardHeight: H } };
        el.i18n = {
          title: 'E2E Harness',
          description: 'Deterministic z-flow dataset for Playwright.',
        };
        el.cards = CARDS;
        el.availableCards = AVAILABLE_CARDS;

        // Expose the latest saved payload for assertions. Tests reset this
        // before saving, then poll for it to reappear.
        window.__mfpSaved = null;
        el.addEventListener('saved', (e) => {
          window.__mfpSaved = e.detail;
        });

        // Drag placeholder observability. The grey "origin" placeholder is
        // shown only in the brief window between gridstack's dragStart and the
        // first drag event (onDrag immediately hides it again), so polling the
        // DOM for it is racy — a test can miss the frame it is visible. The
        // Dashboard component exposes no output() for drag events (only `saved`
        // is proxied by createCustomElement), so instead we watch the DOM with
        // a MutationObserver and LATCH a flag the first time each placeholder
        // ever appears. Tests then assert "was shown" (a durable signal) rather
        // than "is visible right now" (an ephemeral one). resetDragObservers()
        // (called from the test) clears the latches before a fresh drag.
        window.__mfpDrag = { greyShown: false, blueShown: false };
        window.__mfpResetDrag = () => {
          window.__mfpDrag = { greyShown: false, blueShown: false };
        };
        const isRendered = (node) => {
          if (!(node instanceof HTMLElement)) return false;
          const style = getComputedStyle(node);
          return style.visibility !== 'hidden' && style.display !== 'none';
        };
        const dragObserver = new MutationObserver(() => {
          const grey = document.querySelector(
            '.mfp-dashboard__drag-origin-placeholder',
          );
          if (grey && isRendered(grey)) window.__mfpDrag.greyShown = true;
          const blue = document.querySelector('.grid-stack-placeholder');
          if (blue && isRendered(blue)) window.__mfpDrag.blueShown = true;
        });
        dragObserver.observe(el, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['style', 'class'],
        });

        // Readiness signal for the harness helper: element defined + rendered.
        customElements.whenDefined('mfp-wc-dashboard').then(() => {
          window.__mfpReady = true;
        });
      })();
    </script>

    <!-- Self-contained dashboard bundle (Angular + gridstack + UI5 + icons).
         Imported LAST so the properties above are present at element upgrade. -->
    <script type="module" src="./mfp-wc-dashboard.js"></script>
  </body>
</html>

# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# The workflow always passes an explicit `--tag <version>` computed by semver-action,
# so git-cliff acts purely as a formatter and never decides the version itself.

[changelog]
# The header/intro lives statically at the top of CHANGELOG.md; git-cliff only renders
# per-release sections, which the release workflow inserts beneath that intro.
header = ""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}\
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
# Parse commits according to the Conventional Commits specification.
conventional_commits = true
# Do not include commits that are not conventional.
filter_unconventional = true
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# Regex for preprocessing commit messages.
commit_preprocessors = []
# Regex for parsing and grouping commits.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  { message = "^docs", skip = true },
  { message = "^style", skip = true },
  { message = "^refactor", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { body = ".*security", group = "<!-- 4 -->Security" },
]
# Protect breaking changes from being skipped.
protect_breaking_commits = true
# Filter out commits that are not matched by any parser.
filter_commits = false
# Sort tags topologically.
topo_order = false
# Order releases newest first.
sort_commits = "newest"
